<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="theme-color" content="#faf8f3">
<title>중간고사 플래너</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <button data-tab="cal"><span>📅</span>달력</button>

  <button data-tab="more"><span>⚙️</span>기타</button>
</nav>

<script src="app.js"></script>

</html>
